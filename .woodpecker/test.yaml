---
when:
  - event: push
    branch: [main, dev]

matrix:
  GO_VERSION:
    - 1.25
    - 1.24

steps:
  - name: test
    image: golang:${GO_VERSION}
    environment:
      GOTOOLCHAIN: local
    commands:
      - go mod download && (cd ./internal/analyze/testdata && go mod download)
      - echo "🔨 Testing on $(go version):"
      - go test ./...
