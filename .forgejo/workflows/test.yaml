---
name: Test
'on':
  push:
    branches:
      - main
jobs:
  test:
    name: Test on Go ${{ matrix.go }}
    permissions:
      checks: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: codeberg-small-lazy
    timeout-minutes: 10
    strategy:
      matrix:
        go: ['1.26', '1.25']
        include:
          - go: '1.26'
            go-version: '1.26.4'
            latest: true
          - go: '1.25'
            go-version: '1.25.11'
    env:
      GOTOOLCHAIN: local
    steps:
      - name: ✔ Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: 🐹 Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: '**/go.sum'
      - name: ⬇️ Download test packages
        run: (cd ./analyzer/testdata && go mod download)
      - name: 🔨 Test
        run: go test ./...
