---
name: Test
'on':
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
jobs:
  test:
    name: Test on Go ${{ matrix.go }}
    permissions:
      checks: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      matrix:
        go: ['1.26', '1.25']
        include:
          - go: '1.26'
            go-version: '1.26.4'
            latest: true
          - go: '1.25'
            go-version: '1.25.11'
    env:
      GOTOOLCHAIN: local
    steps:
      - name: ✔ Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: 🐹 Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: '**/go.sum'
      - name: 🧸 golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: ${{ matrix.latest }}
        with:
          version: v2.12.2
          verify: false
      - name: ⬇️ Download test packages
        run: (cd ./analyzer/testdata && go mod download)
      - name: 🔨 Test
        run: go test -coverpkg ./... -coverprofile=cover.out ./...
      - name: 🧑🏻‍💻 codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        if: ${{ matrix.latest }}
        with:
          disable_search: true
          files: ./cover.out
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: fillmore-labs/errortype
