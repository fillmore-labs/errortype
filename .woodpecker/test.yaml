---
when:
  - event: push
    branch: [main, dev]

matrix:
  GO_VERSION:
    - "tip-20251011"
    - "1.25.3"
    - "1.24.9"

steps:
  - name: test
    image: golang:${GO_VERSION}
    environment:
      GOTOOLCHAIN: local
    commands:
      - go mod download && (cd ./internal/analyze/testdata && go mod download)
      - echo "🔨 Testing on $(go version):"
      - go test ./...
